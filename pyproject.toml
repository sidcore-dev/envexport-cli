[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "envexport-cli"
version = "1.0.0"
description = "Turn a .env file into shell export lines, docker -e flags, or a flat JSON object, with no dependencies."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "sidcore-dev" }]
keywords = ["env", "dotenv", "cli", "devtools"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Environment :: Console",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/sidcore-dev/envexport-cli"
Repository = "https://github.com/sidcore-dev/envexport-cli"
Issues = "https://github.com/sidcore-dev/envexport-cli/issues"

[project.scripts]
envexport-cli = "envexport_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
